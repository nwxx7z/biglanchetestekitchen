/* ===== DESIGN PREMIUM 2026 — PAINEL DA COZINHA ===== */
:root{

body{

}

<script>
/* BIG LANCHE Printer Bridge
   O APK expõe window.AndroidPrinter. No navegador normal, mantém o QZ Tray.
*/
window.BIGLANCHE_PRINTER = {
  // O bridge existe mesmo antes de uma impressora ser configurada.
  // "ready" indica se já existe uma impressora salva e pronta para imprimir.
  bridgeAvailable: () => !!window.AndroidPrinter,
  available: () => !!window.AndroidPrinter,
  ready: () => !!window.AndroidPrinter && (!window.AndroidPrinter.isReady || window.AndroidPrinter.isReady()),
  connect: async () => {
    if (!window.AndroidPrinter) throw new Error("Ponte Android não disponível");
    const r = window.AndroidPrinter.connectPrinter();
    return r === undefined ? true : r;
  },
  print: async (data) => {
    if (!window.AndroidPrinter) throw new Error("Ponte Android não disponível");
    const r = window.AndroidPrinter.printEscPos(String(data));
    return r === undefined ? true : r;
  },
  simulate: async (data) => {
    if (!window.AndroidPrinter?.simulatePrint) throw new Error("Modo de simulação disponível apenas no aplicativo Android");
    const r = window.AndroidPrinter.simulatePrint(String(data));
    return r === undefined ? true : r;
  }
};
</script>

    color:#cdb8aa !important;
    border-color:#5a4436 !important;
    background:rgba(51,38,29,.55) !important;
  }

  .auth-screen{
    background:
      radial-gradient(circle at 20% 0%,rgba(245,185,53,.07),transparent 24rem),
      linear-gradient(135deg,#1f1712,#35251d) !important;
  }

  .auth-card{
    background:#33261d !important;
    color:#fff1d6 !important;
    border-color:#5a4436 !important;
    box-shadow:0 22px 60px rgba(0,0,0,.40) !important;
  }

  .auth-card p{
    color:#cdb8aa !important;
  }

  .auth-card input{
    background:#3a2a21 !important;
    color:#fff1d6 !important;
    border-color:#6b5142 !important;
  }

  .auth-card input::placeholder{
    color:#a89182 !important;
  }

  .auth-card input:focus{
    border-color:#a77857 !important;
    box-shadow:0 0 0 4px rgba(167,120,87,.15) !important;
  }

  .auth-error{
    color:#ff9e92 !important;
  }

  .dot.ok{
    background:#69a276 !important;
    box-shadow:0 0 0 4px rgba(105,162,118,.14),0 0 14px rgba(105,162,118,.26) !important;
  }
}

/* =========================================================
   Performance / movimento
   ========================================================= */

.order,
.tab,
.toolbar button,
.actions button,
.auth-card input{
  will-change:auto;
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto !important}
  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }

  .order.new::before{
    animation:none !important;
  }
}

@media (max-width:650px){
  .tabs{
    border-radius:14px 14px 0 0;
  }

  .order{
    border-radius:18px !important;
  }

  .auth-card{
    border-radius:20px !important;
  }
}
</style>

</head>
<body>
<div id="loginScreen" class="auth-screen">
  <form id="loginForm" class="auth-card">
    <h2>🔒 Acesso da cozinha</h2>
    <p>Digite a senha para abrir o painel de pedidos.</p>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Senha" required>
    <button class="primary" type="submit">Entrar</button>
    <p id="loginError" class="auth-error"></p>
  </form>
</div>
<div id="app" class="hidden">

<header><div class="head"><h1>🍔 BIG LANCHE · Cozinha</h1><div class="status"><span id="dot" class="dot"></span><span id="status">Conectando...</span></div></div></header>
<div class="tabs" role="tablist" aria-label="Pedidos">
  <button id="tabActive" class="tab active" type="button" role="tab" aria-selected="true">Pedidos <span id="countActive" class="tab-count">0</span></button>
  <button id="tabReady" class="tab" type="button" role="tab" aria-selected="false">Prontos <span id="countReady" class="tab-count">0</span></button>
</div>
<main>
<div class="toolbar"><button class="primary" id="connect">🖨️ Conectar impressora</button><button id="testPrint">🧪 Testar impressão</button><button id="refresh">Atualizar</button><button id="logout">Sair</button></div>
<div id="orders" class="orders"><div class="empty">Nenhum pedido.</div></div>
</main>
<script>
const API_URL=location.origin, PRINT_PRINTER="";
let qzReady=false, orders=[], authenticated=false, currentTab="active";
let autoPrintSeen=new Set();
let autoPrintBusy=new Set();
const $=s=>document.querySelector(s);
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const printSafe=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E\n\r]/g,"");
function status(t,ok=false){$("#status").textContent=t;$("#dot").className="dot "+(ok?"ok":"");}
function showLogin(message=""){authenticated=false;$("#app").classList.add("hidden");$("#loginScreen").classList.remove("hidden");$("#loginError").textContent=message;setTimeout(()=>$("#loginPassword").focus(),0)}
function showApp(){authenticated=true;$("#loginScreen").classList.add("hidden");$("#app").classList.remove("hidden")}
async function api(p,o={}){const r=await fetch(API_URL+p,{cache:"no-store",credentials:"same-origin",...o,headers:{"Content-Type":"application/json",...(o.headers||{})}});if(r.status===401){showLogin("Sua sessão expirou. Entre novamente.");throw Error("AUTH_REQUIRED")}if(!r.ok)throw Error(await r.text());return r.json();}
async function checkAuth(){try{const r=await fetch(API_URL+"/api/auth",{cache:"no-store",credentials:"same-origin"});if(r.ok){showApp();return true}}catch(e){}showLogin();return false}
async function doLogin(password){const r=await fetch(API_URL+"/api/auth",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});if(!r.ok){let msg="Senha incorreta";try{msg=(await r.json()).error||msg}catch(e){}throw Error(msg)}showApp();await load();}
async function doLogout(){try{await fetch(API_URL+"/api/auth",{method:"DELETE",credentials:"same-origin"})}catch(e){}showLogin();}
async function connectPrinter(){
  try{
    if(window.BIGLANCHE_PRINTER.bridgeAvailable()){
      await window.BIGLANCHE_PRINTER.connect();
      qzReady=false;
      status("Impressora Android conectada",true);
      return;
    }
    if(!window.qz)throw Error("QZ Tray não carregado");
    if(!qz.websocket.isActive())await qz.websocket.connect();
    const p=PRINT_PRINTER||await qz.printers.getDefault();
    if(!p)throw Error("Sem impressora");
    qzReady=true;
    status("Impressora: "+p,true);
  }catch(e){
    qzReady=false;
    status("Impressora não conectada");
    alert(e.message);
  }
}
function pedidoTime(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  return new Intl.DateTimeFormat("pt-BR",{hour:"2-digit",minute:"2-digit"}).format(d);
}
function setTab(tab){
  currentTab=tab;
  const active=tab==="active";
  $("#tabActive").classList.toggle("active",active);
  $("#tabReady").classList.toggle("active",!active);
  $("#tabActive").setAttribute("aria-selected",String(active));
  $("#tabReady").setAttribute("aria-selected",String(!active));
  render();
}
function card(o){
  const items=(o.cart||[]).map(i=>{
    const adds=(i.additions||[]);
    return `<div class="item">
      <div class="item-name">${i.quantity}x ${esc(i.name)}</div>
      ${adds.length?`<div class="add-title">Adicionais:</div>${adds.map(a=>`<div class="add">+ ${a.quantity||1}x ${esc(a.name)}</div>`).join("")}`:""}
      ${i.note?`<div class="item-note"><b>Obs.:</b> ${esc(i.note)}</div>`:""}
    </div>`;
  }).join("");
  const time=pedidoTime(o.createdAt);
  const isReady=o.status==="ready";
  const actions=isReady
    ? `<button onclick="setStatus('${esc(o.id)}','preparing')">↩️ Voltar para pedidos</button><button class="danger" onclick="deleteOrder('${esc(o.id)}', '${esc(o.number)}')">🗑️ Excluir</button>`
    : `<button class="primary" onclick="printOrder('${esc(o.id)}')">🖨️ Imprimir</button><button onclick="setStatus('${esc(o.id)}','preparing')">Em preparo</button><button onclick="setStatus('${esc(o.id)}','ready')">Pronto</button><button class="danger" onclick="deleteOrder('${esc(o.id)}', '${esc(o.number)}')">🗑️ Excluir</button>`;
  return `<article class="order ${o.status==="new"?"new":""}">
    <div class="order-head">
      <div><div class="number">Pedido #${esc(o.number)}</div>${time?`<div class="order-time">Feito às ${time}</div>`:""}</div>
      <span class="badge ${o.status==="printed"?"printed":"new"}">${isReady?"Pronto":o.status==="printed"?"Impresso":o.status==="preparing"?"Em preparo":"Novo"}</span>
    </div>
    ${items}
    <div class="meta">
      <div><b>Entrega:</b> ${esc(o.delivery?.city||"")} ${o.delivery?.fee? "· "+money(o.delivery.fee):""}</div>
      <div><b>Endereço:</b> ${esc(o.delivery?.address||"")}</div>
      <div><b>Pagamento:</b> ${esc(o.payment||"")}</div>
      ${o.notes?`<div><b>Obs.:</b> ${esc(o.notes)}</div>`:""}
    </div>
    <div class="total">Total: ${money(o.total)}</div>
    <div class="actions">${actions}</div>
  </article>`;
}
function render(){
  const activeOrders=orders.filter(o=>o.status!=="ready");
  const readyOrders=orders.filter(o=>o.status==="ready");
  $("#countActive").textContent=activeOrders.length;
  $("#countReady").textContent=readyOrders.length;
  const list=currentTab==="ready"?readyOrders:activeOrders;
  $("#orders").innerHTML=list.length
    ? list.slice().sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)).reverse().map(card).join("")
    : `<div class="empty">${currentTab==="ready"?"Nenhum pedido pronto.":"Nenhum pedido em andamento."}</div>`;
}
function receipt(o){const line="-".repeat(42),a=["\x1B\x40","\x1B\x61\x01","\x1B\x45\x01","BIG LANCHE","PEDIDO #"+o.number,"\x1B\x45\x00",line,"\x1B\x61\x00"];for(const i of o.cart||[]){a.push(`${i.quantity}x ${printSafe(i.name)}`);for(const x of i.additions||[])a.push(`   + ${x.quantity||1}x ${printSafe(x.name)}`);if(i.note)a.push(`   OBS: ${printSafe(i.note)}`)}a.push(line,`Entrega: ${printSafe(o.delivery?.city)} ${o.delivery?.fee?money(o.delivery.fee):""}`,`Endereco: ${printSafe(o.delivery?.address)}`,`Pagamento: ${printSafe(o.payment)}`,o.notes?`Obs: ${printSafe(o.notes)}`:"",`TOTAL: ${money(o.total)}`,"","","","\x1D\x56\x00");return a.join("\n");}
async function printOrder(id,automatic=false){
  const o=orders.find(x=>x.id===id);
  if(!o)return;
  const raw=receipt(o);
  try{
    if(window.BIGLANCHE_PRINTER.available()){
      const sent=await window.BIGLANCHE_PRINTER.print(raw);
      if(!sent) throw Error("Impressora não respondeu");
      await setStatus(id,"printed");
      if(automatic) status("Pedido #"+o.number+" impresso automaticamente",true);
      return true;
    }
    if(!qzReady){browserPrint(o);return}
    const p=PRINT_PRINTER||await qz.printers.getDefault(),
          c=qz.configs.create(p,{jobName:`BIG LANCHE Pedido #${o.number}`});
    await qz.print(c,[{type:"raw",format:"command",flavor:"plain",data:raw}]);
    await setStatus(id,"printed");
    return true;
  }catch(e){
    if(!automatic) alert("Falha na impressão: "+e.message);
    return false;
  }
}
function browserPrint(o){const w=window.open("","_blank","width=420,height=700");if(!w)return;w.document.write(`<style>body{font:14px monospace;width:80mm;margin:0;padding:5mm}.i{font-weight:700;margin:6px 0}.a{padding-left:10px}.t{font-size:18px;font-weight:900;margin-top:12px}</style><h2>BIG LANCHE<br>Pedido #${esc(o.number)}</h2>${(o.cart||[]).map(i=>`<div class=i>${i.quantity}x ${esc(i.name)}${(i.additions||[]).map(a=>`<div class=a>+ ${a.quantity||1}x ${esc(a.name)}</div>`).join("")}${i.note?`<div class=a><b>Obs.:</b> ${esc(i.note)}</div>`:""}</div>`).join("")}<hr>Entrega: ${esc(o.delivery?.city)}<br>Endereco: ${esc(o.delivery?.address)}<br>Pagamento: ${esc(o.payment)}<div class=t>TOTAL: ${money(o.total)}</div><script>window.print()<\/script>`);w.document.close();}
async function testPrintSimulation(){
  if(!window.BIGLANCHE_PRINTER?.bridgeAvailable() || !window.BIGLANCHE_PRINTER?.simulate){
    alert("O modo de simulação está disponível apenas no aplicativo Android.");
    return;
  }
  const o=orders.find(x=>x.status!=="ready") || {
    number:"TESTE",
    cart:[{quantity:1,name:"Pastel mistão",additions:[],note:"sem salada"}],
    delivery:{city:"Maragogi",fee:10,address:"Rua de teste, 123"},
    payment:"Pix",
    total:30
  };
  try{
    // A simulação deve mostrar o texto legível, sem os bytes de controle ESC/POS.
    // A impressão real continua usando o recibo bruto com ESC/POS.
    const preview = receipt(o)
      .replace(/\\x1B[@aE](?:\\x01|\\x00)?/g, "")
      .replace(/\\x1D[Vv](?:\\x00|\\x01)?/g, "")
      .replace(/[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F]/g, "");
    await window.BIGLANCHE_PRINTER.simulate(preview);
  }catch(e){
    alert("Falha no modo de simulação: "+e.message);
  }
}
async function setStatus(id,s){
  await api("/api/orders/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:s})});
  const o=orders.find(x=>x.id===id);
  if(o)o.status=s;
  render();
}

async function deleteOrder(id,number){
  if(!confirm(`Excluir o pedido #${number}?\n\nEssa ação não pode ser desfeita.`)) return;

  try{
    await api("/api/orders/"+encodeURIComponent(id),{method:"DELETE"});
    orders=orders.filter(o=>o.id!==id);
    render();
    status(`Pedido #${number} excluído`,true);
  }catch(e){
    if(e.message!=="AUTH_REQUIRED") alert("Não foi possível excluir o pedido: "+e.message);
  }
}
async function load(){try{
  const previous=orders;
  orders=await api("/api/orders");
  status(qzReady||window.BIGLANCHE_PRINTER?.ready()?"Pedidos + impressora":"Pedidos conectados",true);
  render();
  if(window.BIGLANCHE_PRINTER?.ready()){
    for(const o of orders){
      if(o.status!=="new" || autoPrintSeen.has(o.id) || autoPrintBusy.has(o.id)) continue;
      autoPrintBusy.add(o.id);
      try{
        const ok=await printOrder(o.id,true);
        if(ok) autoPrintSeen.add(o.id);
      }catch(e){}
      finally{autoPrintBusy.delete(o.id);}
    }
  }
}catch{status("Servidor offline");}}
$("#connect").onclick=connectPrinter;$("#testPrint").onclick=testPrintSimulation;$("#refresh").onclick=load;$("#logout").onclick=doLogout;
if(window.BIGLANCHE_PRINTER?.bridgeAvailable()) $("#testPrint").hidden=false;$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=$("#loginForm button");const p=$("#loginPassword").value.trim();if(!p)return;$("#loginError").textContent="";b.disabled=true;try{await doLogin(p);$("#loginPassword").value=""}catch(err){$("#loginError").textContent=err.message||"Senha incorreta";$("#loginPassword").select()}finally{b.disabled=false}});let kitchenPollTimer=null;
let kitchenPollBusy=false;
async function pollKitchen(){if(!authenticated||document.hidden||kitchenPollBusy)return;kitchenPollBusy=true;try{await load()}finally{kitchenPollBusy=false}}
function startKitchenPolling(){if(kitchenPollTimer)clearInterval(kitchenPollTimer);kitchenPollTimer=setInterval(pollKitchen,10000)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&authenticated)pollKitchen()});
checkAuth().then(ok=>{if(ok){load();startKitchenPolling()}});$("#tabActive").onclick=()=>setTab("active");$("#tabReady").onclick=()=>setTab("ready");
</script>
</div></body>
</html>
