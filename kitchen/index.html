<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG LANCHE — Cozinha</title>
<script src="https://cdn.jsdelivr.net/npm/qz-tray/qz-tray.js"></script>
<style>
:root{--bg:#f3eee8;--card:#fffaf5;--ink:#2c211a;--muted:#7a6b61;--line:#dfd3c8;--accent:#5f493a;--ok:#4f7b5c;--warn:#b77932;--danger:#a6473d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fffaf5eF;border-bottom:1px solid var(--line);padding:14px 18px}
.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:1.1rem;margin:0}
.status{color:var(--muted);font-size:.85rem}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999;margin-right:6px}.dot.ok{background:var(--ok)}
main{max-width:1100px;margin:20px auto;padding:0 14px 40px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
button{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.order{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 4px 15px #3223190e}.order.new{box-shadow:0 0 0 2px #b779322b,0 6px 18px #32231914}
.order-head{display:flex;justify-content:space-between;align-items:center}.number{font-weight:800;font-size:1.15rem}.badge{padding:4px 8px;border-radius:999px;font-size:.72rem;font-weight:700;background:#eadfd4}.badge.new{background:#f3dfc2}.badge.printed{background:#dcebdd}
.item{padding:9px 0;border-bottom:1px solid var(--line)}.item-name{font-weight:800}.add{padding-left:10px;color:var(--muted);font-size:.88rem}.item-note{margin-top:5px;padding-left:10px;color:var(--warn);font-size:.88rem}.meta{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:grid;gap:5px}.total{font-size:1.08rem;font-weight:900;margin-top:10px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.empty{text-align:center;padding:36px;color:var(--muted)}
.tabs{max-width:1100px;margin:14px auto 0;display:flex;gap:8px}.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer}.tab.active{background:var(--ink);color:#fff}.tab-count{opacity:.75;margin-left:5px}.order-time{font-size:.82rem;color:var(--muted);margin-top:3px}.add-title{margin-top:6px;font-weight:800;font-size:.84rem;color:var(--ink)}
@media(max-width:650px){.head{flex-direction:column;align-items:flex-start}.orders{grid-template-columns:1fr}}

.auth-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 12px 40px #32231918}
.auth-card h2{margin:0 0 8px;font-size:1.25rem}.auth-card p{margin:0 0 18px;color:var(--muted)}
.auth-card input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}
.auth-card button{width:100%;margin-top:12px}.auth-error{min-height:20px;margin-top:10px!important;color:var(--danger)!important;font-size:.88rem}
.hidden{display:none!important}
</style>

<script>
/* BIG LANCHE Printer Bridge
   O APK expõe window.AndroidPrinter. No navegador normal, mantém o QZ Tray.
*/
window.BIGLANCHE_PRINTER = {
  available: () => !!window.AndroidPrinter && !!window.AndroidPrinter.isReady && window.AndroidPrinter.isReady(),
  connect: async () => {
    if (!window.AndroidPrinter) throw new Error("Ponte Android não disponível");
    const r = window.AndroidPrinter.connectPrinter();
    return r === undefined ? true : r;
  },
  print: async (data) => {
    if (!window.AndroidPrinter) throw new Error("Ponte Android não disponível");
    const r = window.AndroidPrinter.printEscPos(String(data));
    return r === undefined ? true : r;
  }
};
</script>

</head>
<body>
<div id="loginScreen" class="auth-screen">
  <form id="loginForm" class="auth-card">
    <h2>🔒 Acesso da cozinha</h2>
    <p>Digite a senha para abrir o painel de pedidos.</p>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Senha" required>
    <button class="primary" type="submit">Entrar</button>
    <p id="loginError" class="auth-error"></p>
  </form>
</div>
<div id="app" class="hidden">

<header><div class="head"><h1>🍔 BIG LANCHE · Cozinha</h1><div class="status"><span id="dot" class="dot"></span><span id="status">Conectando...</span></div></div></header>
<div class="tabs" role="tablist" aria-label="Pedidos">
  <button id="tabActive" class="tab active" type="button" role="tab" aria-selected="true">Pedidos <span id="countActive" class="tab-count">0</span></button>
  <button id="tabReady" class="tab" type="button" role="tab" aria-selected="false">Prontos <span id="countReady" class="tab-count">0</span></button>
</div>
<main>
<div class="toolbar"><button class="primary" id="connect">🖨️ Conectar impressora</button><button id="testPrint">🧪 Testar impressão</button><button id="refresh">Atualizar</button><button id="logout">Sair</button></div>
<div id="orders" class="orders"><div class="empty">Nenhum pedido.</div></div>
</main>
<script>
const API_URL=location.origin, PRINT_PRINTER="";
let qzReady=false, orders=[], authenticated=false, currentTab="active";
let autoPrintSeen=new Set();
let autoPrintBusy=new Set();
const $=s=>document.querySelector(s);
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const printSafe=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E\n\r]/g,"");
function status(t,ok=false){$("#status").textContent=t;$("#dot").className="dot "+(ok?"ok":"");}
function showLogin(message=""){authenticated=false;$("#app").classList.add("hidden");$("#loginScreen").classList.remove("hidden");$("#loginError").textContent=message;setTimeout(()=>$("#loginPassword").focus(),0)}
function showApp(){authenticated=true;$("#loginScreen").classList.add("hidden");$("#app").classList.remove("hidden")}
async function api(p,o={}){const r=await fetch(API_URL+p,{cache:"no-store",credentials:"same-origin",...o,headers:{"Content-Type":"application/json",...(o.headers||{})}});if(r.status===401){showLogin("Sua sessão expirou. Entre novamente.");throw Error("AUTH_REQUIRED")}if(!r.ok)throw Error(await r.text());return r.json();}
async function checkAuth(){try{const r=await fetch(API_URL+"/api/auth",{cache:"no-store",credentials:"same-origin"});if(r.ok){showApp();return true}}catch(e){}showLogin();return false}
async function doLogin(password){const r=await fetch(API_URL+"/api/auth",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});if(!r.ok){let msg="Senha incorreta";try{msg=(await r.json()).error||msg}catch(e){}throw Error(msg)}showApp();await load();}
async function doLogout(){try{await fetch(API_URL+"/api/auth",{method:"DELETE",credentials:"same-origin"})}catch(e){}showLogin();}
async function connectPrinter(){
  try{
    // Dentro do APK, a ponte Android sempre tem prioridade.
    // Não tente QZ Tray mesmo que nenhuma impressora esteja configurada ainda.
    if(window.AndroidPrinter){
      await window.BIGLANCHE_PRINTER.connect();
      qzReady=false;
      status("Selecione a impressora no Android",true);
      return;
    }
    // Fora do APK, mantém o QZ Tray para uso no PC.
    if(!window.qz)throw Error("QZ Tray não carregado");
    if(!qz.websocket.isActive())await qz.websocket.connect();
    const p=PRINT_PRINTER||await qz.printers.getDefault();
    if(!p)throw Error("Sem impressora");
    qzReady=true;
    status("Impressora: "+p,true);
  }catch(e){
    qzReady=false;
    status("Impressora não conectada");
    alert(e.message);
  }
}
function pedidoTime(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  return new Intl.DateTimeFormat("pt-BR",{hour:"2-digit",minute:"2-digit"}).format(d);
}
function setTab(tab){
  currentTab=tab;
  const active=tab==="active";
  $("#tabActive").classList.toggle("active",active);
  $("#tabReady").classList.toggle("active",!active);
  $("#tabActive").setAttribute("aria-selected",String(active));
  $("#tabReady").setAttribute("aria-selected",String(!active));
  render();
}
function card(o){
  const items=(o.cart||[]).map(i=>{
    const adds=(i.additions||[]);
    return `<div class="item">
      <div class="item-name">${i.quantity}x ${esc(i.name)}</div>
      ${adds.length?`<div class="add-title">Adicionais:</div>${adds.map(a=>`<div class="add">+ ${a.quantity||1}x ${esc(a.name)}</div>`).join("")}`:""}
      ${i.note?`<div class="item-note"><b>Obs.:</b> ${esc(i.note)}</div>`:""}
    </div>`;
  }).join("");
  const time=pedidoTime(o.createdAt);
  const isReady=o.status==="ready";
  const actions=isReady
    ? `<button onclick="setStatus('${esc(o.id)}','preparing')">↩️ Voltar para pedidos</button>`
    : `<button class="primary" onclick="printOrder('${esc(o.id)}')">🖨️ Imprimir</button><button onclick="setStatus('${esc(o.id)}','preparing')">Em preparo</button><button onclick="setStatus('${esc(o.id)}','ready')">Pronto</button>`;
  return `<article class="order ${o.status==="new"?"new":""}">
    <div class="order-head">
      <div><div class="number">Pedido #${esc(o.number)}</div>${time?`<div class="order-time">Feito às ${time}</div>`:""}</div>
      <span class="badge ${o.status==="printed"?"printed":"new"}">${isReady?"Pronto":o.status==="printed"?"Impresso":o.status==="preparing"?"Em preparo":"Novo"}</span>
    </div>
    ${items}
    <div class="meta">
      <div><b>Entrega:</b> ${esc(o.delivery?.city||"")} ${o.delivery?.fee? "· "+money(o.delivery.fee):""}</div>
      <div><b>Endereço:</b> ${esc(o.delivery?.address||"")}</div>
      <div><b>Pagamento:</b> ${esc(o.payment||"")}</div>
      ${o.notes?`<div><b>Obs.:</b> ${esc(o.notes)}</div>`:""}
    </div>
    <div class="total">Total: ${money(o.total)}</div>
    <div class="actions">${actions}</div>
  </article>`;
}
function render(){
  const activeOrders=orders.filter(o=>o.status!=="ready");
  const readyOrders=orders.filter(o=>o.status==="ready");
  $("#countActive").textContent=activeOrders.length;
  $("#countReady").textContent=readyOrders.length;
  const list=currentTab==="ready"?readyOrders:activeOrders;
  $("#orders").innerHTML=list.length
    ? list.slice().sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)).reverse().map(card).join("")
    : `<div class="empty">${currentTab==="ready"?"Nenhum pedido pronto.":"Nenhum pedido em andamento."}</div>`;
}
function receipt(o){const line="-".repeat(42),a=["\x1B\x40","\x1B\x61\x01","\x1B\x45\x01","BIG LANCHE","PEDIDO #"+o.number,"\x1B\x45\x00",line,"\x1B\x61\x00"];for(const i of o.cart||[]){a.push(`${i.quantity}x ${printSafe(i.name)}`);for(const x of i.additions||[])a.push(`   + ${x.quantity||1}x ${printSafe(x.name)}`);if(i.note)a.push(`   OBS: ${printSafe(i.note)}`)}a.push(line,`Entrega: ${printSafe(o.delivery?.city)} ${o.delivery?.fee?money(o.delivery.fee):""}`,`Endereco: ${printSafe(o.delivery?.address)}`,`Pagamento: ${printSafe(o.payment)}`,o.notes?`Obs: ${printSafe(o.notes)}`:"",`TOTAL: ${money(o.total)}`,"","","","\x1D\x56\x00");return a.join("\n");}
function simulatePrint(){
  const o=orders.find(x=>x.status!=="ready") || orders[0];
  if(!o){alert("Não há nenhum pedido para testar.");return;}
  const raw=receipt(o);
  // Remove os bytes de controle ESC/POS apenas da visualização.
  const preview=raw
    .replace(/\x1B(?:[\x00-\xFF])/g,"")
    .replace(/\x1D(?:[\x00-\xFF])/g,"")
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,"")
    .trim();

  let modal=document.getElementById("printTestModal");
  if(modal) modal.remove();

  modal=document.createElement("div");
  modal.id="printTestModal";
  modal.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;padding:18px";
  modal.innerHTML=`
    <div style="width:min(560px,100%);max-height:90vh;overflow:auto;background:#fffaf5;color:#2c211a;border:1px solid #dfd3c8;border-radius:16px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.3)">
      <h2 style="margin:0 0 6px">🧪 Simulação de impressão</h2>
      <p style="color:#6f6259;margin:0 0 14px">Nenhum dado foi enviado para uma impressora. Esta é apenas uma prévia.</p>
      <div style="background:#fff;margin-top:10px;padding:16px;border:1px dashed #bbb;white-space:pre-wrap;font:14px/1.45 monospace;overflow:auto">${esc(preview)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
        <button id="closePrintTest" style="padding:10px 16px;border:1px solid #dfd3c8;border-radius:9px;background:#fff;color:#2c211a;font-size:15px">Fechar</button>
        <button id="printPreview" style="padding:10px 16px;border:0;border-radius:9px;background:#5f493a;color:#fff;font-size:15px">🖨️ Imprimir prévia</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  const close=()=>modal.remove();
  document.getElementById("closePrintTest").onclick=close;
  document.getElementById("printPreview").onclick=()=>{
    const w=window.open("","_blank","width=430,height=760");
    if(!w){alert("Permita pop-ups para imprimir a prévia.");return;}
    w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Teste de impressão</title><style>body{font:14px monospace;width:80mm;margin:0;padding:5mm}.t{font-size:18px;font-weight:900}</style></head><body>${esc(preview).replace(/\n/g,"<br>")}<script>window.print()<\/script></body></html>`);
    w.document.close();
  };
  modal.addEventListener("click",e=>{if(e.target===modal)close()});
}
async function printOrder(id,automatic=false){
  const o=orders.find(x=>x.id===id);
  if(!o)return;
  const raw=receipt(o);
  try{
    if(window.AndroidPrinter){
      if(!window.BIGLANCHE_PRINTER.available()) {
        if(!automatic) alert("Configure a impressora no botão 🖨️ antes de imprimir.");
        return false;
      }
      const sent=await window.BIGLANCHE_PRINTER.print(raw);
      if(!sent) throw Error("Impressora não respondeu");
      await setStatus(id,"printed");
      if(automatic) status("Pedido #"+o.number+" impresso automaticamente",true);
      return true;
    }
    if(!qzReady){browserPrint(o);return}
    const p=PRINT_PRINTER||await qz.printers.getDefault(),
          c=qz.configs.create(p,{jobName:`BIG LANCHE Pedido #${o.number}`});
    await qz.print(c,[{type:"raw",format:"command",flavor:"plain",data:raw}]);
    await setStatus(id,"printed");
    return true;
  }catch(e){
    if(!automatic) alert("Falha na impressão: "+e.message);
    return false;
  }
}
function browserPrint(o){const w=window.open("","_blank","width=420,height=700");if(!w)return;w.document.write(`<style>body{font:14px monospace;width:80mm;margin:0;padding:5mm}.i{font-weight:700;margin:6px 0}.a{padding-left:10px}.t{font-size:18px;font-weight:900;margin-top:12px}</style><h2>BIG LANCHE<br>Pedido #${esc(o.number)}</h2>${(o.cart||[]).map(i=>`<div class=i>${i.quantity}x ${esc(i.name)}${(i.additions||[]).map(a=>`<div class=a>+ ${a.quantity||1}x ${esc(a.name)}</div>`).join("")}${i.note?`<div class=a><b>Obs.:</b> ${esc(i.note)}</div>`:""}</div>`).join("")}<hr>Entrega: ${esc(o.delivery?.city)}<br>Endereco: ${esc(o.delivery?.address)}<br>Pagamento: ${esc(o.payment)}<div class=t>TOTAL: ${money(o.total)}</div><script>window.print()<\/script>`);w.document.close();}
async function setStatus(id,s){await api("/api/orders/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:s})});const o=orders.find(x=>x.id===id);if(o)o.status=s;render();}
async function load(){try{
  const previous=orders;
  orders=await api("/api/orders");
  status(qzReady||window.BIGLANCHE_PRINTER?.available()?"Pedidos + impressora":"Pedidos conectados",true);
  render();
  if(window.BIGLANCHE_PRINTER?.available()){
    for(const o of orders){
      if(o.status!=="new" || autoPrintSeen.has(o.id) || autoPrintBusy.has(o.id)) continue;
      autoPrintBusy.add(o.id);
      try{
        const ok=await printOrder(o.id,true);
        if(ok) autoPrintSeen.add(o.id);
      }catch(e){}
      finally{autoPrintBusy.delete(o.id);}
    }
  }
}catch{status("Servidor offline");}}
$("#connect").onclick=connectPrinter;$("#testPrint").onclick=simulatePrint;$("#refresh").onclick=load;$("#logout").onclick=doLogout;$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=$("#loginForm button");const p=$("#loginPassword").value.trim();if(!p)return;$("#loginError").textContent="";b.disabled=true;try{await doLogin(p);$("#loginPassword").value=""}catch(err){$("#loginError").textContent=err.message||"Senha incorreta";$("#loginPassword").select()}finally{b.disabled=false}});checkAuth().then(ok=>{if(ok)load()});setInterval(()=>{if(authenticated)load()},2500);$("#tabActive").onclick=()=>setTab("active");$("#tabReady").onclick=()=>setTab("ready");
</script>
</div></body>
</html>
